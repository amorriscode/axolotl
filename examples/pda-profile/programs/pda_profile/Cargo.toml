[package]
name = "pda-profile"
version = "0.1.0"
description = "User profile stored at a PDA"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pda_profile"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "1.2.2"
