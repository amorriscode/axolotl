[package]
name = "token-vault"
version = "0.1.0"
description = "SPL token vault using a PDA authority"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"
