[package]
name = "conformance"
version = "0.1.0"
description = "Axolotl conformance program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "conformance"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
init-if-needed = ["anchor-lang/init-if-needed"]
default = ["init-if-needed"]

[dependencies]
anchor-lang = "1.2.2"
